name: Build web app and Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pacer-build
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        run: npm install
      - name: Create the Android project
        run: npx cap add android
      - name: Copy the web app into it
        run: npx cap sync android
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk pacer-reader.apk
      - name: Keep the APK as a build file
        uses: actions/upload-artifact@v4
        with:
          name: pacer-reader-apk
          path: pacer-reader.apk
      - name: Publish it on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Pacer Reader (latest build)
          body: Install `pacer-reader.apk` on your Android phone. Open the file, allow "install from this source" when asked.
          files: pacer-reader.apk
